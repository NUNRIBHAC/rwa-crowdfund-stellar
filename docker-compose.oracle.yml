# Oracle Always Free VM deployment for the Blockallisto app (see docs/oracle-hosting.md).
# Joins the existing weblate_default network so the established https-portal
# container can route <name>.92-5-187-71.sslip.io -> http://<service>:4000.
# Env files live at deploy/env/*.env on the VM only - never committed (.env* is
# gitignored); each value is provisioned at deploy time per docs/oracle-hosting.md.
services:
  staging:
    build: .
    image: blockallisto-app:local
    container_name: blockallisto-staging
    env_file: ./deploy/env/staging.env
    # Durable contributor-recovery queue: PENDING_CONTRIBUTORS_PATH in
    # deploy/env/staging.env points here (/app is root-owned, the app runs as
    # node/1000). Named volumes are created root-owned, so after the FIRST
    # `compose up` of this change, chown the ACTUAL volume (compose prefixes
    # the project name; confirm with `docker inspect <container> --format
    # '{{range .Mounts}}{{.Name}}{{"\n"}}{{end}}'`), e.g.:
    #   docker run --rm -v <actual-volume>:/q alpine chown 1000:1000 /q
    # The volume survives container replacement (and any Neon rollback), which
    # is what makes the queue durable.
    volumes:
      - blockallisto-queue-staging:/queue
    expose:
      - '4000'
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    networks:
      - weblate_default

  demo:
    build: .
    image: blockallisto-app:local
    container_name: blockallisto-demo
    env_file: ./deploy/env/demo.env
    volumes:
      - blockallisto-queue-demo:/queue
    expose:
      - '4000'
    restart: unless-stopped
    mem_limit: 512m
    cpus: 0.75
    networks:
      - weblate_default

volumes:
  blockallisto-queue-staging:
  blockallisto-queue-demo:

networks:
  weblate_default:
    external: true
