name: visual

# Synthetic visual regression via Argos. Captures run against a locally served
# production build with synthetic API data (no live/private data).
# Current capture suite: 917 tests, including route captures and journey checks.
# Hobby has a hard free quota: uploads pause at its limit; never upgrade automatically.
on:
  # One run per change: pushes to main fire `push`; while a PR is open its
  # branch pushes fire `pull_request` (synchronize) instead - no double runs.
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  argos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build frontend
        run: npm run build -w frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Capture screenshots
        working-directory: frontend
        run: npx playwright test
      - name: Test Argos upload error handling
        run: node --test scripts/argos-upload.test.mjs
      - name: Upload screenshots
        # No secret ever reaches PR-controlled tests. Only reviewed main can
        # upload, including manual main runs; branch dispatches stay tokenless.
        if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
        working-directory: frontend
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: node ../scripts/argos-upload.mjs
