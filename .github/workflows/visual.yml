name: visual

# Synthetic visual regression via Argos. Captures run against a locally served
# production build with the API stubbed offline (deterministic, no live data).
# Budget guardrail: 5 captures per run, single viewport. This is NOT full UI
# coverage - it is a smoke matrix for layout regressions on key pages.
on:
  push:
    branches: [main, feature/community-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  argos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install
        run: npm ci
      - name: Build frontend
        run: npm run build -w frontend
      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Capture and upload to Argos
        working-directory: frontend
        env:
          ARGOS_TOKEN: ${{ secrets.ARGOS_TOKEN }}
        run: npx playwright test
