<svg xmlns="http://www.w3.org/2000/svg" width="920" height="660" viewBox="0 0 920 660" font-family="'Inter',system-ui,sans-serif"><rect width="920" height="660" fill="#FFFFFF"/><text x="32" y="46" font-family="'Montserrat','Inter',system-ui,sans-serif" font-size="24" font-weight="700" fill="#14163A">Layout foundations</text><text x="32" y="72" font-size="14" fill="#5A5C75">Grid, spacing scale and corner radius scale for web and mobile</text><rect x="32" y="110" width="560" height="120" rx="8" fill="#F6F6FE" stroke="#E6E6FB" stroke-width="1"/><rect x="32" y="110" width="24" height="120" fill="#EDEDFC"/><rect x="568" y="110" width="24" height="120" fill="#EDEDFC"/><rect x="56.0" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="100.7" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="145.3" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="190.0" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="234.7" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="279.3" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="324.0" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="368.7" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="413.3" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="458.0" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="502.7" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="547.3" y="120" width="20.7" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><text x="32" y="252" font-size="13" font-weight="600" fill="#14163A">Desktop: 12 flexible columns</text><text x="32" y="270" font-size="12" fill="#5A5C75">24px fixed side margins &#183; 24px gutters &#183; max width 1280px, centered</text><rect x="664" y="110" width="120" height="120" rx="8" fill="#F6F6FE" stroke="#E6E6FB" stroke-width="1"/><rect x="664" y="110" width="12" height="120" fill="#EDEDFC"/><rect x="772" y="110" width="12" height="120" fill="#EDEDFC"/><rect x="676.0" y="120" width="18.0" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="702.0" y="120" width="18.0" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="728.0" y="120" width="18.0" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><rect x="754.0" y="120" width="18.0" height="100" rx="3" fill="#C7C8F9" fill-opacity="0.55"/><text x="664" y="252" font-size="13" font-weight="600" fill="#14163A">Mobile: 4 columns</text><text x="664" y="270" font-size="12" fill="#5A5C75">24px side margins*</text><text x="664" y="286" font-size="11" fill="#9596A6">*margins stay 24px; drawn smaller here</text><text x="32" y="300" font-family="'Montserrat','Inter',system-ui,sans-serif" font-size="14" font-weight="600" fill="#14163A">Corner radius scale</text><rect x="32" y="316" width="64" height="64" rx="4" fill="#F6F6FE" stroke="#4B4FE2" stroke-width="1.5"/><text x="32" y="404" font-size="12.5" font-weight="600" fill="#14163A">radius-sm - 4px</text><text x="32" y="420" font-size="11.5" fill="#5A5C75">checkboxes, tags, small badges</text><rect x="254" y="316" width="64" height="64" rx="8" fill="#F6F6FE" stroke="#4B4FE2" stroke-width="1.5"/><text x="254" y="404" font-size="12.5" font-weight="600" fill="#14163A">radius-md - 8px</text><text x="254" y="420" font-size="11.5" fill="#5A5C75">buttons, text inputs</text><rect x="476" y="316" width="64" height="64" rx="16" fill="#F6F6FE" stroke="#4B4FE2" stroke-width="1.5"/><text x="476" y="404" font-size="12.5" font-weight="600" fill="#14163A">radius-lg - 16px</text><text x="476" y="420" font-size="11.5" fill="#5A5C75">asset cards, dropdown menus</text><rect x="698" y="316" width="64" height="64" rx="24" fill="#F6F6FE" stroke="#4B4FE2" stroke-width="1.5"/><text x="698" y="404" font-size="12.5" font-weight="600" fill="#14163A">radius-xl - 24px</text><text x="698" y="420" font-size="11.5" fill="#5A5C75">modals, dashboard blocks</text><text x="32" y="470" font-family="'Montserrat','Inter',system-ui,sans-serif" font-size="14" font-weight="600" fill="#14163A">Spacing scale - the only allowed margin/padding values (4px base)</text><rect x="32" y="486" width="12" height="16" rx="3" fill="#4B4FE2"/><text x="32" y="526" font-size="12.5" fill="#5A5C75">space-4 = 4px</text><rect x="162" y="486" width="24" height="16" rx="3" fill="#4B4FE2"/><text x="162" y="526" font-size="12.5" fill="#5A5C75">space-8 = 8px</text><rect x="292" y="486" width="36" height="16" rx="3" fill="#4B4FE2"/><text x="292" y="526" font-size="12.5" fill="#5A5C75">space-12 = 12px</text><rect x="422" y="486" width="48" height="16" rx="3" fill="#4B4FE2"/><text x="422" y="526" font-size="12.5" fill="#5A5C75">space-16 = 16px</text><rect x="552" y="486" width="72" height="16" rx="3" fill="#4B4FE2"/><text x="552" y="526" font-size="12.5" fill="#5A5C75">space-24 = 24px</text><rect x="682" y="486" width="96" height="16" rx="3" fill="#4B4FE2"/><text x="682" y="526" font-size="12.5" fill="#5A5C75">space-32 = 32px</text><line x1="32" y1="602" x2="888" y2="602" stroke="#E6E6FB" stroke-width="1"/><text x="32" y="626" font-size="12.5" fill="#5A5C75">No arbitrary margins - compose from the grid and this scale. Logo corners keep relative radii (tile 22.5%, block 14.1%).</text></svg>