# Blockallisto - SEP-1 anchor metadata for the Stellar testnet prototype.
# Demo deployment: https://blockallisto-demo.onrender.com (example production
# domain: blockallisto.com). This is a prototype: no live offers, no real funds.
NETWORK_PASSPHRASE = "Test SDF Network ; September 2015"
HORIZON_URL = "https://horizon-testnet.stellar.org"
SOROBAN_RPC_URL = "https://soroban-testnet.stellar.org"

# The demo registers one Soroban crowdfunding campaign contract (all-or-nothing,
# enforced on-chain): demo-solar = CCBIMGPHIOUFN6IC6MYPFXOGJQIRJHHDXA2Y7LQDCYBSJOKHULICO6NY
