# No validators are operated and no compliance contacts exist for this prototype;
# those sections are intentionally omitted rather than filled with placeholders.

ORG_NAME = "Blockallisto"
ORG_DBA = "Blockallisto"
ORG_URL = "https://blockallisto-demo.onrender.com"
