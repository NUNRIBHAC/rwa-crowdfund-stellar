<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 480" role="img" aria-labelledby="title desc"><title id="title">A question takes shape</title><desc id="desc">Purple rounded-square tiles assemble into a question mark with a separate dot. Decorative animation.</desc><style>.tile{animation:form 7s ease-in-out infinite;animation-delay:var(--delay)}@keyframes form{0%,8%{opacity:.22;transform:translate(var(--dx),var(--dy))}32%,74%{opacity:1;transform:translate(0,0)}100%{opacity:.22;transform:translate(var(--dx),var(--dy))}}@media(prefers-reduced-motion:reduce){.tile{animation:none;opacity:1;transform:none}}</style><rect width="480" height="480" fill="#F7F6FE"/><rect class="tile" x="170" y="40" width="36" height="36" rx="8" fill="#4B4FE2" style="--delay:0.0s;--dx:0px;--dy:-6px"/><rect class="tile" x="216" y="40" width="36" height="36" rx="8" fill="#8D87EF" style="--delay:0.065s;--dx:27px;--dy:-33px"/><rect class="tile" x="262" y="40" width="36" height="36" rx="8" fill="#CBC8F7" style="--delay:0.13s;--dx:-36px;--dy:-53px"/><rect class="tile" x="124" y="86" width="36" height="36" rx="8" fill="#4B4FE2" style="--delay:0.195s;--dx:21px;--dy:-21px"/><rect class="tile" x="308" y="86" width="36" height="36" rx="8" fill="#8D87EF" style="--delay:0.26s;--dx:8px;--dy:-9px"/><rect class="tile" x="308" y="132" width="36" height="36" rx="8" fill="#CBC8F7" style="--delay:0.325s;--dx:-32px;--dy:-44px"/><rect class="tile" x="262" y="178" width="36" height="36" rx="8" fill="#4B4FE2" style="--delay:0.39s;--dx:34px;--dy:-47px"/><rect class="tile" x="216" y="224" width="36" height="36" rx="8" fill="#8D87EF" style="--delay:0.455s;--dx:-14px;--dy:-11px"/><rect class="tile" x="216" y="270" width="36" height="36" rx="8" fill="#CBC8F7" style="--delay:0.52s;--dx:-16px;--dy:-18px"/><rect class="tile" x="216" y="362" width="36" height="36" rx="8" fill="#4B4FE2" style="--delay:0.585s;--dx:35px;--dy:-52px"/></svg>
