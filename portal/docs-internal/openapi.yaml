openapi: 3.0.3
info:
  title: Blockallisto API
  version: 0.2.0-draft
  description: >-
    REST API contract for the Blockallisto testnet prototype, generated from the
    Express route definitions in backend/src (server.ts, community-routes.ts,
    infrastructure/router.ts) at current main. DRAFT: paths, methods and auth
    requirements are source-verified; request/response schemas are intentionally
    generic until each handler's zod validation is transcribed. Path coverage synchronized to main @0962c6f on 2026-11-03. The
    /api/infrastructure/* group is a TEST-ONLY service bound to 127.0.0.1
    (INFRA_PORT, default 4100) - never exposed publicly. Admin routes fail
    closed (503) when ADMIN_SECRET is not configured.
servers:
  - url: https://demo.92-5-187-71.sslip.io
    description: Demo (public testnet app)
  - url: https://staging.92-5-187-71.sslip.io
    description: Staging (load and realistic tests)
  - url: http://127.0.0.1:4100
    description: Infrastructure test API (localhost only)
tags:
  - name: System
  - name: Campaigns
  - name: Soroban
  - name: Account
  - name: Auth
  - name: Appropriateness
  - name: Companies
  - name: Community
  - name: Admin
  - name: Content
  - name: Support
  - name: Issuer
  - name: Notifications
  - name: Operator
  - name: Infrastructure (test-only)
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Session token from POST /api/auth/verify (Freighter challenge signature).
    adminKey:
      type: apiKey
      in: header
      name: x-admin-key
      description: Shared admin secret (timing-safe compared against ADMIN_SECRET).
    infraBearer:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: 'Per-principal infrastructure credential (roles: compliance, valuation, governor, operator, auditor); test-only service.'
paths:
  /health:
    get:
      tags: ['System']
      summary: Liveness probe
      responses:
        '200': { description: Success }
        '4XX': { description: Client error (validation, auth or state) }

