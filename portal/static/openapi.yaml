openapi: 3.0.3
info:
  title: Blockallisto API
  version: 0.2.0-draft
  description: >-
    REST API contract for the Blockallisto testnet prototype. DRAFT: paths,
    HTTP methods and authentication requirements are source-verified;
    request/response schemas are intentionally generic until each
    handler's zod validation is transcribed. This public copy omits
    platform-administration, operator-console and internal test-only
    endpoints.
servers:
  - url: https://demo.92-5-187-71.sslip.io
    description: Demo (public testnet app)
  - url: https://staging.92-5-187-71.sslip.io
    description: Staging (load and realistic tests)
tags:
  - name: System
  - name: Campaigns
  - name: Soroban
  - name: Account
  - name: Auth
  - name: Appropriateness
  - name: Companies
  - name: Community
  - name: Content
  - name: Support
  - name: Issuer
  - name: Notifications
components:
  securitySchemes:
    sessionAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: Session token from POST /api/auth/verify (Freighter challenge signature).
    adminKey:
      type: apiKey
      in: header
      name: x-admin-key
      description: Shared admin secret (timing-safe compared against ADMIN_SECRET).
paths:
  /health:
    get:
      tags: ['System']
      summary: Liveness probe
      responses:
        '200': { description: Success }
        '4XX': { description: Client error (validation, auth or state) }

  /api/campaigns:
    get:
      tags: ['Campaigns']
      summary: List campaigns with current state
      responses:
        '200': { description: Success }
        '4XX': { description: Client error (validation, auth or state) }

  /api/campaigns/{id}/metadata:
    get:
      tags: ['Campaigns']
      summary: Campaign metadata
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      responses:
        '200': { description: Success }
        '4XX': { description: Client error (validation, auth or state) }

  /api/campaigns/{id}/soroban/build:
    post:
      tags: ['Soroban']
      summary: Build an unsigned contribution transaction (XDR)
      security: [{ sessionAuth: [] }]
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object }
      responses:
        '200': { description: Success }
        '4XX': { description: Client error (validation, auth or state) }

  /api/campaigns/{id}/soroban/submit:
    post:
      tags: ['Soroban']
      summary: Submit a signed contribution transaction
